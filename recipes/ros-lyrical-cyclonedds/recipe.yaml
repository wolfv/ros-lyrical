# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-cyclonedds
  version: 11.0.1
source:
  git: https://github.com/ros2-gbp/cyclonedds-release.git
  tag: release/lyrical/cyclonedds/11.0.1-4
  target_directory: ros-lyrical-cyclonedds/src/work

build:
  script: ${{ '$RECIPE_DIR/build_catkin.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_catkin.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://projects.eclipse.org/projects/iot.cyclonedds
  repository: https://github.com/eclipse-cyclonedds/cyclonedds
  license: EPL-2.0 OR BSD-3-Clause
  summary: Eclipse Cyclone DDS is a very performant and robust open-source DDS implementation. Cyclone DDS is developed completely in the open as an Eclipse IoT project.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: build_platform != target_platform
      then:
        - ros-lyrical-cyclonedds
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - openssl
    - pip
    - python
    - ros-lyrical-iceoryx-hoofs
    - ros-lyrical-iceoryx-posh
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - openssl
    - python
    - ros-lyrical-iceoryx-hoofs
    - ros-lyrical-iceoryx-posh
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
