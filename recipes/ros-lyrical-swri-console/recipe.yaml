# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-swri-console
  version: 2.1.2
source:
  git: https://github.com/ros2-gbp/swri_console-release.git
  tag: release/lyrical/swri_console/2.1.2-5
  target_directory: ros-lyrical-swri-console/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/swri_console
  license: BSD-3-Clause
  summary: A rosout GUI viewer developed at Southwest Research Institute as an alternative to rqt_console.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros-lyrical-rosidl-default-generators
    - if: build_platform != target_platform
      then:
        - qt-main
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - qt-main
    - ros-lyrical-ament-cmake
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclcpp
    - ros-lyrical-rmw
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosbag2-transport
    - ros-lyrical-rosidl-default-generators
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - qt-main
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclcpp
    - ros-lyrical-rmw
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosbag2-storage-mcap
    - ros-lyrical-rosbag2-transport
    - ros-lyrical-rosidl-default-runtime
    - ros2-distro-mutex 0.16.* lyrical_*
