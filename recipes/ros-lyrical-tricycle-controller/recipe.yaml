# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-tricycle-controller
  version: 6.7.0
source:
  git: https://github.com/ros2-gbp/ros2_controllers-release.git
  tag: release/lyrical/tricycle_controller/6.7.0-1
  target_directory: ros-lyrical-tricycle-controller/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://control.ros.org
  repository: https://github.com/ros-controls/ros2_controllers/
  license: Apache-2.0
  summary: Controller for a tricycle drive mobile base
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ackermann-msgs
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-backward-ros
    - ros-lyrical-builtin-interfaces
    - ros-lyrical-controller-interface
    - ros-lyrical-controller-manager
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-hardware-interface-testing
    - ros-lyrical-nav-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rcpputils
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-cmake
    - ros-lyrical-ros2-control-test-assets
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ackermann-msgs
    - ros-lyrical-backward-ros
    - ros-lyrical-builtin-interfaces
    - ros-lyrical-controller-interface
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-nav-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rcpputils
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
