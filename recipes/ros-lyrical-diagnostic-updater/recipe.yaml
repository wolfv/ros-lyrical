# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-diagnostic-updater
  version: 4.4.6
source:
  git: https://github.com/ros2-gbp/diagnostics-release.git
  tag: release/lyrical/diagnostic_updater/4.4.6-3
  target_directory: ros-lyrical-diagnostic-updater/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://www.ros.org/wiki/diagnostic_updater
  license: BSD-3-Clause
  summary: diagnostic_updater contains tools for easily updating diagnostics. it is commonly used in device drivers to keep track of the status of output topics, device status, etc.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-pytest
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-diagnostic-msgs
    - ros-lyrical-launch
    - ros-lyrical-launch-testing
    - ros-lyrical-launch-testing-ros
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rclpy
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-diagnostic-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-rclpy
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
