# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ur-robot-driver
  version: 6.0.0
source:
  git: https://github.com/ros2-gbp/Universal_Robots_ROS2_Driver-release.git
  tag: release/lyrical/ur_robot_driver/6.0.0-1
  target_directory: ros-lyrical-ur-robot-driver/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_Driver
  homepage: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/
  license: BSD-3-Clause
  summary: The ROS 2 driver for Universal Robots manipulators. This driver supports all robot models as listed in the documentation. For robot controllers, PolyScope X, PolyScope 5 and CB3 controllers are supported.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-backward-ros
    - ros-lyrical-control-msgs
    - ros-lyrical-controller-manager
    - ros-lyrical-controller-manager-msgs
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-motion-primitives-controllers
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rclpy
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2run
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-ur-client-library
    - ros-lyrical-ur-controllers
    - ros-lyrical-ur-dashboard-msgs
    - ros-lyrical-ur-description
    - ros-lyrical-ur-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-backward-ros
    - ros-lyrical-control-msgs
    - ros-lyrical-controller-manager
    - ros-lyrical-controller-manager-msgs
    - ros-lyrical-force-torque-sensor-broadcaster
    - ros-lyrical-forward-command-controller
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-joint-state-broadcaster
    - ros-lyrical-joint-state-publisher
    - ros-lyrical-joint-trajectory-controller
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-motion-primitives-controllers
    - ros-lyrical-pluginlib
    - ros-lyrical-pose-broadcaster
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rclpy
    - ros-lyrical-robot-state-publisher
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-controllers-test-nodes
    - ros-lyrical-rviz2
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-ur-client-library
    - ros-lyrical-ur-controllers
    - ros-lyrical-ur-dashboard-msgs
    - ros-lyrical-ur-description
    - ros-lyrical-ur-msgs
    - ros-lyrical-urdf
    - ros-lyrical-xacro
    - ros2-distro-mutex 0.16.* lyrical_*
    - socat
