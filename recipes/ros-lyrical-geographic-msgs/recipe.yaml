# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-geographic-msgs
  version: 1.0.6
source:
  git: https://github.com/ros2-gbp/geographic_info-release.git
  tag: release/lyrical/geographic_msgs/1.0.6-3
  target_directory: ros-lyrical-geographic-msgs/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://wiki.ros.org/geographic_msgs
  repository: https://github.com/ros-geographic-info/geographic_info.git
  license: BSD-3-Clause
  summary: ROS messages for Geographic Information Systems.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros-lyrical-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-cppcheck
    - ros-lyrical-ament-cmake-cpplint
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-uncrustify
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-geometry-msgs
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-generators
    - ros-lyrical-std-msgs
    - ros-lyrical-unique-identifier-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-geometry-msgs
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-runtime
    - ros-lyrical-std-msgs
    - ros-lyrical-unique-identifier-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
