# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ros-gz-bridge
  version: 3.0.8
source:
  git: https://github.com/ros2-gbp/ros_ign-release.git
  tag: release/lyrical/ros_gz_bridge/3.0.8-3
  target_directory: ros-lyrical-ros-gz-bridge/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Bridge communication between ROS and Gazebo Transport
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pkg-config
    - python
    - ros-lyrical-actuator-msgs
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-geometry-msgs
    - ros-lyrical-gps-msgs
    - ros-lyrical-gz-msgs-vendor
    - ros-lyrical-gz-transport-vendor
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-launch-testing
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-marine-acoustic-msgs
    - ros-lyrical-nav-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-gz-interfaces
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosgraph-msgs
    - ros-lyrical-rosidl-pycommon
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-tf2-msgs
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-vision-msgs
    - ros-lyrical-yaml-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-actuator-msgs
    - ros-lyrical-geometry-msgs
    - ros-lyrical-gps-msgs
    - ros-lyrical-gz-msgs-vendor
    - ros-lyrical-gz-transport-vendor
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-marine-acoustic-msgs
    - ros-lyrical-nav-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-gz-interfaces
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosgraph-msgs
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-tf2-msgs
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-vision-msgs
    - ros-lyrical-yaml-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
