# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-gz-ros2-control-demos
  version: 3.0.8
source:
  git: https://github.com/ros2-gbp/ign_ros2_control-release.git
  tag: release/lyrical/gz_ros2_control_demos/3.0.8-1
  target_directory: ros-lyrical-gz-ros2-control-demos/src/work
  patches:
    - patch/ros-lyrical-gz-ros2-control-demos.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/ros-controls/gz_ros2_control/blob/master/README.md
  repository: https://github.com/ros-controls/gz_ros2_control
  license: Apache-2.0
  summary: gz_ros2_control_demos
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-control-msgs
    - ros-lyrical-control-toolbox
    - ros-lyrical-geometry-msgs
    - ros-lyrical-gz-ros2-control
    - ros-lyrical-gz-sim-vendor
    - ros-lyrical-hardware-interface
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-action
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-cmake
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ackermann-steering-controller
    - ros-lyrical-ament-index-python
    - ros-lyrical-control-msgs
    - ros-lyrical-control-toolbox
    - ros-lyrical-diff-drive-controller
    - ros-lyrical-force-torque-sensor-broadcaster
    - ros-lyrical-forward-command-controller
    - ros-lyrical-geometry-msgs
    - ros-lyrical-gz-ros2-control
    - ros-lyrical-gz-sim-vendor
    - ros-lyrical-hardware-interface
    - ros-lyrical-imu-sensor-broadcaster
    - ros-lyrical-joint-state-broadcaster
    - ros-lyrical-joint-trajectory-controller
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-mecanum-drive-controller
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-robot-state-publisher
    - ros-lyrical-ros-gz-bridge
    - ros-lyrical-ros-gz-sim
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-cmake
    - ros-lyrical-ros2controlcli
    - ros-lyrical-ros2launch
    - ros-lyrical-std-msgs
    - ros-lyrical-tricycle-steering-controller
    - ros-lyrical-xacro
    - ros2-distro-mutex 0.16.* lyrical_*
