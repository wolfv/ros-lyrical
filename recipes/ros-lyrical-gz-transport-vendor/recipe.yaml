# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-gz-transport-vendor
  version: 0.3.4
source:
  git: https://github.com/ros2-gbp/gz_transport_vendor-release.git
  tag: release/lyrical/gz_transport_vendor/0.3.4-3
  target_directory: ros-lyrical-gz-transport-vendor/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/gazebosim/gz-transport
  license: Apache-2.0
  summary: 'Vendor package for: gz-transport 15.0.2 Gazebo Transport: Provides fast and efficient asynchronous message passing, services, and data logging.'
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: build_platform != target_platform
      then:
        - pybind11
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - cppzmq
    - libgz-transport
    - libprotobuf
    - numpy
    - pip
    - pkg-config
    - protobuf
    - psutil
    - pybind11
    - pytest
    - python
    - ros-lyrical-ament-cmake-copyright
    - ros-lyrical-ament-cmake-core
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-test
    - ros-lyrical-ament-cmake-vendor-package
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-gz-cmake-vendor
    - ros-lyrical-gz-math-vendor
    - ros-lyrical-gz-msgs-vendor
    - ros-lyrical-gz-tools-vendor
    - ros-lyrical-gz-utils-vendor
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-zenoh-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
    - sqlite 3.*
    - zeromq
  run:
    - cppzmq
    - libgz-transport
    - libprotobuf
    - pkg-config
    - protobuf
    - psutil
    - pybind11
    - pytest
    - python
    - ros-lyrical-gz-cmake-vendor
    - ros-lyrical-gz-math-vendor
    - ros-lyrical-gz-msgs-vendor
    - ros-lyrical-gz-tools-vendor
    - ros-lyrical-gz-utils-vendor
    - ros-lyrical-ros-workspace
    - ros-lyrical-zenoh-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
    - sqlite
    - zeromq
