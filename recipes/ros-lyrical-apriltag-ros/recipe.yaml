# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-apriltag-ros
  version: 3.3.0
source:
  git: https://github.com/ros2-gbp/apriltag_ros-release.git
  tag: release/lyrical/apriltag_ros/3.3.0-3
  target_directory: ros-lyrical-apriltag-ros/src/work
  patches:
    - patch/ros-lyrical-apriltag-ros.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: MIT
  summary: AprilTag detection node
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - clang-format
    - eigen
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-clang-format
    - ros-lyrical-ament-cmake-cppcheck
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-apriltag
    - ros-lyrical-apriltag-msgs
    - ros-lyrical-cv-bridge
    - ros-lyrical-image-transport
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros-lyrical-tf2-ros
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-apriltag
    - ros-lyrical-apriltag-msgs
    - ros-lyrical-camera-ros
    - ros-lyrical-cv-bridge
    - ros-lyrical-image-proc
    - ros-lyrical-image-transport
    - ros-lyrical-image-transport-plugins
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros-lyrical-tf2-ros
    - ros2-distro-mutex 0.16.* lyrical_*
