# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-realtime-tools
  version: 5.2.0
source:
  git: https://github.com/ros2-gbp/realtime_tools-release.git
  tag: release/lyrical/realtime_tools/5.2.0-3
  target_directory: ros-lyrical-realtime-tools/src/work
  patches:
    - patch/ros-lyrical-realtime-tools.osx.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://control.ros.org
  repository: https://github.com/ros-controls/realtime_tools/
  license: BSD-3-Clause
  summary: Contains a set of tools that can be used from a hard realtime thread, without breaking the realtime behavior.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-lifecycle-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-action
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-cmake
    - ros-lyrical-test-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - libboost-devel
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-action
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
