# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-controller-interface
  version: 6.7.1
source:
  git: https://github.com/ros2-gbp/ros2_control-release.git
  tag: release/lyrical/controller_interface/6.7.1-1
  target_directory: ros-lyrical-controller-interface/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Base classes for controllers and syntax cookies for supporting common sensor types in controllers and broadcasters
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - fmt
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gen-version-h
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-pal-statistics
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-cmake
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-hardware-interface
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
