# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ur-controllers
  version: 6.0.0
source:
  git: https://github.com/ros2-gbp/Universal_Robots_ROS2_Driver-release.git
  tag: release/lyrical/ur_controllers/6.0.0-1
  target_directory: ros-lyrical-ur-controllers/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_Driver
  homepage: https://docs.universal-robots.com/Universal_Robots_ROS_Documentation/
  license: BSD-3-Clause
  summary: Provides controllers that use the speed scaling interface of Universal Robots.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-action-msgs
    - ros-lyrical-ament-cmake
    - ros-lyrical-angles
    - ros-lyrical-control-msgs
    - ros-lyrical-controller-interface
    - ros-lyrical-controller-manager
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-joint-trajectory-controller
    - ros-lyrical-lifecycle-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rcutils
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-test-assets
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-ros
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-ur-dashboard-msgs
    - ros-lyrical-ur-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-action-msgs
    - ros-lyrical-angles
    - ros-lyrical-control-msgs
    - ros-lyrical-controller-interface
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-geometry-msgs
    - ros-lyrical-hardware-interface
    - ros-lyrical-joint-trajectory-controller
    - ros-lyrical-lifecycle-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rcutils
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-ros
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-ur-dashboard-msgs
    - ros-lyrical-ur-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
