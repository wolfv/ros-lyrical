# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-image-pipeline
  version: 7.1.6
source:
  git: https://github.com/ros2-gbp/image_pipeline-release.git
  tag: release/lyrical/image_pipeline/7.1.6-1
  target_directory: ros-lyrical-image-pipeline/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://index.ros.org/p/image_pipeline/
  repository: https://github.com/ros-perception/image_pipeline
  license: BSD-3-Clause
  summary: image_pipeline fills the gap between getting raw images from a camera driver and higher-level vision processing.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-camera-calibration
    - ros-lyrical-depth-image-proc
    - ros-lyrical-image-proc
    - ros-lyrical-image-publisher
    - ros-lyrical-image-rotate
    - ros-lyrical-image-view
    - ros-lyrical-ros-workspace
    - ros-lyrical-stereo-image-proc
    - ros2-distro-mutex 0.16.* lyrical_*
