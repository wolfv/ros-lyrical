# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ur-simulation-gz
  version: 2.5.0
source:
  git: https://github.com/ros2-gbp/ur_simulation_gz-release.git
  tag: release/lyrical/ur_simulation_gz/2.5.0-3
  target_directory: ros-lyrical-ur-simulation-gz/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/UniversalRobots/Universal_Robots_ROS2_GZ_Simulation
  license: BSD-3-Clause
  summary: Example and configuration files for Gazebo simulation of UR manipulators.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-pytest
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-launch-testing-ros
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-xacro
    - ros2-distro-mutex 0.16.* lyrical_*
    - urdfdom
  run:
    - python
    - ros-lyrical-gz-ros2-control
    - ros-lyrical-joint-state-publisher
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-ros-gz-bridge
    - ros-lyrical-ros-gz-sim
    - ros-lyrical-ros-workspace
    - ros-lyrical-rviz2
    - ros-lyrical-ur-controllers
    - ros-lyrical-ur-description
    - ros-lyrical-ur-moveit-config
    - ros-lyrical-urdf
    - ros-lyrical-xacro
    - ros2-distro-mutex 0.16.* lyrical_*
