# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rosx-introspection
  version: 2.3.0
source:
  git: https://github.com/ros2-gbp/rosx_introspection-release.git
  tag: release/lyrical/rosx_introspection/2.3.0-3
  target_directory: ros-lyrical-rosx-introspection/src/work
  patches:
    - patch/ros-lyrical-rosx-introspection.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: MIT
  summary: Parse any ROS/ROS2 message without compile-time information
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - rapidjson
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-geometry-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosbag2-cpp
    - ros-lyrical-sensor-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - rapidjson
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosbag2-cpp
    - ros2-distro-mutex 0.16.* lyrical_*
