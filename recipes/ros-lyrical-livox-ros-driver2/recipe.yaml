# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-livox-ros-driver2
  version: 1.2.4
source:
  git: https://github.com/Livox-SDK/livox_ros_driver2.git
  tag: 1.2.4
  target_directory: ros-lyrical-livox-ros-driver2/src/work
  patches:
    - patch/ros-lyrical-livox-ros-driver2.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: MIT
  summary: The ROS device driver for Livox 3D LiDARs, for ROS2
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros-lyrical-rosidl-default-generators
    - if: build_platform != target_platform
      then:
        - git
  host:
    - apr
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen-abi-devel
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - livox-sdk2
    - numpy
    - pcl
    - pip
    - python
    - ros-lyrical-ament-cmake-auto
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-pcl-conversions
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rcutils
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-generators
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
    - vtk-base
    - if: build_platform == target_platform
      then:
        - git
  run:
    - apr
    - eigen-abi-devel
    - git
    - libboost-devel
    - libgl-devel
    - libopengl-devel
    - pcl
    - python
    - ros-lyrical-pcl-conversions
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rcutils
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosbag2
    - ros-lyrical-rosidl-default-runtime
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
    - vtk-base
