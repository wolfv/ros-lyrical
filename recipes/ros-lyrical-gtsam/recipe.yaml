# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-gtsam
  version: 4.2.0

build:
  number: 20
  script: ''
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: BSD-3-Clause OR MPL-2.0 OR Apache-2.0
  summary: gtsam
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build: []
  host:
    - eigen
    - python
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
    - tbb
    - tbb-devel
  run:
    - eigen
    - gtsam >=4.2.0, <4.3.0a0
    - python
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
    - tbb
    - tbb-devel
