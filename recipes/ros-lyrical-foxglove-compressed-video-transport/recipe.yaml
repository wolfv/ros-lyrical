# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-foxglove-compressed-video-transport
  version: 3.0.2
source:
  git: https://github.com/ros2-gbp/foxglove_compressed_video_transport-release.git
  tag: release/lyrical/foxglove_compressed_video_transport/3.0.2-3
  target_directory: ros-lyrical-foxglove-compressed-video-transport/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://www.ros.org/wiki/image_transport_plugins
  license: Apache-2.0
  summary: foxglove_compressed_video_transport provides a plugin to image_transport for transparently sending an image stream encoded in foxglove compressed video packets.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-clang-format
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-ffmpeg-encoder-decoder
    - ros-lyrical-foxglove-msgs
    - ros-lyrical-image-transport
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rcutils
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ffmpeg-encoder-decoder
    - ros-lyrical-foxglove-msgs
    - ros-lyrical-image-transport
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rcutils
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
