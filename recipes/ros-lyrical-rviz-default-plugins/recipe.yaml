# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rviz-default-plugins
  version: 15.2.3
source:
  git: https://github.com/ros2-gbp/rviz-release.git
  tag: release/lyrical/rviz_default_plugins/15.2.3-1
  target_directory: ros-lyrical-rviz-default-plugins/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/ros2/rviz/blob/ros2/README.md
  repository: https://github.com/ros2/rviz
  license: BSD-3-Clause
  summary: Several default plugins for rviz to cover the basic functionality.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libgl-devel
    - libopengl-devel
    - numpy
    - pip
    - python
    - qt6-main
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-geometry-msgs
    - ros-lyrical-gz-math-vendor
    - ros-lyrical-image-transport
    - ros-lyrical-interactive-markers
    - ros-lyrical-laser-geometry
    - ros-lyrical-map-msgs
    - ros-lyrical-nav-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-point-cloud-transport
    - ros-lyrical-rclcpp
    - ros-lyrical-resource-retriever
    - ros-lyrical-resource-retriever-service-plugin
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rviz-common
    - ros-lyrical-rviz-ogre-vendor
    - ros-lyrical-rviz-rendering
    - ros-lyrical-rviz-rendering-tests
    - ros-lyrical-rviz-visual-testing-framework
    - ros-lyrical-tf2
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-ros
    - ros-lyrical-urdf
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - libgl-devel
    - libopengl-devel
    - python
    - qt6-main
    - ros-lyrical-geometry-msgs
    - ros-lyrical-gz-math-vendor
    - ros-lyrical-image-transport
    - ros-lyrical-interactive-markers
    - ros-lyrical-laser-geometry
    - ros-lyrical-map-msgs
    - ros-lyrical-nav-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-point-cloud-transport
    - ros-lyrical-rclcpp
    - ros-lyrical-resource-retriever
    - ros-lyrical-resource-retriever-service-plugin
    - ros-lyrical-ros-workspace
    - ros-lyrical-rviz-common
    - ros-lyrical-rviz-ogre-vendor
    - ros-lyrical-rviz-rendering
    - ros-lyrical-tf2
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-ros
    - ros-lyrical-urdf
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
