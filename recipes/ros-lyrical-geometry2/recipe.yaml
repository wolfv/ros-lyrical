# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-geometry2
  version: 0.45.7
source:
  git: https://github.com/ros2-gbp/geometry2-release.git
  tag: release/lyrical/geometry2/0.45.7-3
  target_directory: ros-lyrical-geometry2/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://www.ros.org/wiki/geometry2
  license: BSD-3-Clause
  summary: A metapackage to bring in the default packages second generation Transform Library in ros, tf2.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ros-workspace
    - ros-lyrical-tf2
    - ros-lyrical-tf2-bullet
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-eigen-kdl
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-kdl
    - ros-lyrical-tf2-msgs
    - ros-lyrical-tf2-py
    - ros-lyrical-tf2-ros
    - ros-lyrical-tf2-sensor-msgs
    - ros-lyrical-tf2-tools
    - ros2-distro-mutex 0.16.* lyrical_*
