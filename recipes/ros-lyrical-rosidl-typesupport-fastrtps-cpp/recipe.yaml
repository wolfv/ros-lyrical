# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rosidl-typesupport-fastrtps-cpp
  version: 3.9.5
source:
  git: https://github.com/ros2-gbp/rosidl_typesupport_fastrtps-release.git
  tag: release/lyrical/rosidl_typesupport_fastrtps_cpp/3.9.5-3
  target_directory: ros-lyrical-rosidl-typesupport-fastrtps-cpp/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Generate the C++ interfaces for eProsima FastRTPS.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-pytest
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-ament-cmake-ros-core
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-fastcdr
    - ros-lyrical-osrf-testing-tools-cpp
    - ros-lyrical-performance-test-fixture
    - ros-lyrical-rcutils
    - ros-lyrical-rmw
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-buffer-backend
    - ros-lyrical-rosidl-generator-c
    - ros-lyrical-rosidl-generator-cpp
    - ros-lyrical-rosidl-runtime-c
    - ros-lyrical-rosidl-runtime-cpp
    - ros-lyrical-rosidl-typesupport-interface
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ament-cmake-ros-core
    - ros-lyrical-ament-index-python
    - ros-lyrical-fastcdr
    - ros-lyrical-rmw
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-buffer-backend
    - ros-lyrical-rosidl-cli
    - ros-lyrical-rosidl-generator-c
    - ros-lyrical-rosidl-generator-cpp
    - ros-lyrical-rosidl-pycommon
    - ros-lyrical-rosidl-runtime-c
    - ros-lyrical-rosidl-runtime-cpp
    - ros-lyrical-rosidl-typesupport-interface
    - ros2-distro-mutex 0.16.* lyrical_*
