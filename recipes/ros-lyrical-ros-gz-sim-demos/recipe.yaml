# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ros-gz-sim-demos
  version: 3.0.8
source:
  git: https://github.com/ros2-gbp/ros_ign-release.git
  tag: release/lyrical/ros_gz_sim_demos/3.0.8-3
  target_directory: ros-lyrical-ros-gz-sim-demos/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Demos using Gazebo Sim simulation with ROS.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-gz-sim-vendor
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-gz-sim-vendor
    - ros-lyrical-image-transport-plugins
    - ros-lyrical-marine-acoustic-msgs
    - ros-lyrical-robot-state-publisher
    - ros-lyrical-ros-gz-bridge
    - ros-lyrical-ros-gz-image
    - ros-lyrical-ros-gz-sim
    - ros-lyrical-ros-workspace
    - ros-lyrical-rqt-image-view
    - ros-lyrical-rqt-plot
    - ros-lyrical-rqt-topic
    - ros-lyrical-rviz-imu-plugin
    - ros-lyrical-rviz2
    - ros-lyrical-sdformat-urdf
    - ros-lyrical-tf2-ros
    - ros-lyrical-xacro
    - ros2-distro-mutex 0.16.* lyrical_*
