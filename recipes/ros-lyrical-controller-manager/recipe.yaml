# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-controller-manager
  version: 6.7.1
source:
  git: https://github.com/ros2-gbp/ros2_control-release.git
  tag: release/lyrical/controller_manager/6.7.1-1
  target_directory: ros-lyrical-controller-manager/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: The main runnable entrypoint of ros2_control and home of controller management and resource management.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - coverage
    - fmt
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gen-version-h
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-ament-cmake-pytest
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-backward-ros
    - ros-lyrical-controller-interface
    - ros-lyrical-controller-manager-msgs
    - ros-lyrical-diagnostic-updater
    - ros-lyrical-example-interfaces
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-hardware-interface
    - ros-lyrical-hardware-interface-testing
    - ros-lyrical-launch-testing
    - ros-lyrical-libstatistics-collector
    - ros-lyrical-lifecycle-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-realtime-tools
    - ros-lyrical-robot-state-publisher
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2-control-cmake
    - ros-lyrical-ros2-control-test-assets
    - ros-lyrical-ros2pkg
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - filelock
    - fmt
    - python
    - pyyaml
    - ros-lyrical-backward-ros
    - ros-lyrical-controller-interface
    - ros-lyrical-controller-manager-msgs
    - ros-lyrical-diagnostic-updater
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-hardware-interface
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-launch-testing-ros
    - ros-lyrical-libstatistics-collector
    - ros-lyrical-lifecycle-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclcpp
    - ros-lyrical-rclpy
    - ros-lyrical-realtime-tools
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2param
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
