# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rclpy-message-converter
  version: 2.0.2
source:
  git: https://github.com/ros2-gbp/rospy_message_converter-release.git
  tag: release/lyrical/rclpy_message_converter/2.0.2-3
  target_directory: ros-lyrical-rclpy-message-converter/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rospy_message_converter
  repository: https://github.com/DFKI-NI/rospy_message_converter
  license: Apache-2.0
  summary: Converts between Python dictionaries and JSON to rclpy messages.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros-lyrical-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros-lyrical-ament-copyright
    - ros-lyrical-ament-flake8
    - ros-lyrical-ament-pep257
    - ros-lyrical-builtin-interfaces
    - ros-lyrical-geometry-msgs
    - ros-lyrical-rclpy
    - ros-lyrical-rclpy-message-converter-msgs
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-generators
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
    - setuptools
  run:
    - numpy
    - python
    - ros-lyrical-rclpy
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-parser
    - ros-lyrical-rosidl-runtime-py
    - ros2-distro-mutex 0.16.* lyrical_*
