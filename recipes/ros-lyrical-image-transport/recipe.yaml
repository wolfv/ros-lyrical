# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-image-transport
  version: 6.4.8
source:
  git: https://github.com/ros2-gbp/image_common-release.git
  tag: release/lyrical/image_transport/6.4.8-1
  target_directory: ros-lyrical-image-transport/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/image_transport
  repository: https://github.com/ros-perception/image_common
  license: BSD-3-Clause
  summary: image_transport should always be used to subscribe to and publish images. It provides transparent support for transporting images in low-bandwidth compressed formats. Examples (provided by separate plugin packages) include JPEG/PNG compression and Theora streaming video.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-message-filters
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
    - tinyxml2
  run:
    - python
    - ros-lyrical-message-filters
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
    - tinyxml2
