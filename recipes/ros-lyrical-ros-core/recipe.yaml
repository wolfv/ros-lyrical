# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ros-core
  version: 0.13.0
source:
  git: https://github.com/ros2-gbp/variants-release.git
  tag: release/lyrical/ros_core/0.13.0-3
  target_directory: ros-lyrical-ros-core/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: A package to aggregate the packages required to use publish / subscribe, services, generate messages and other core ROS concepts.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-auto
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-pytest
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-ament-index-python
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-class-loader
    - ros-lyrical-common-interfaces
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-launch-testing
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-launch-testing-ros
    - ros-lyrical-launch-xml
    - ros-lyrical-launch-yaml
    - ros-lyrical-pluginlib
    - ros-lyrical-rcl-lifecycle
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-action
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-rclpy
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2cli-common-extensions
    - ros-lyrical-ros2launch
    - ros-lyrical-rosidl-default-generators
    - ros-lyrical-rosidl-default-runtime
    - ros-lyrical-sros2
    - ros-lyrical-sros2-cmake
    - ros2-distro-mutex 0.16.* lyrical_*
