# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rosbridge-library
  version: 4.1.0
source:
  git: https://github.com/ros2-gbp/rosbridge_suite-release.git
  tag: release/lyrical/rosbridge_library/4.1.0-3
  target_directory: ros-lyrical-rosbridge-library/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/rosbridge_library
  repository: https://github.com/RobotWebTools/rosbridge_suite
  license: BSD-3-Clause
  summary: The core rosbridge package, responsible for interpreting JSON and performing the appropriate ROS action, like subscribe, publish, call service, and interact with params.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-action-msgs
    - ros-lyrical-ament-cmake-mypy
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-builtin-interfaces
    - ros-lyrical-control-msgs
    - ros-lyrical-diagnostic-msgs
    - ros-lyrical-example-interfaces
    - ros-lyrical-geometry-msgs
    - ros-lyrical-nav-msgs
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosbridge-test-msgs
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-stereo-msgs
    - ros-lyrical-tf2-msgs
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - cbor2
    - numpy
    - pillow
    - python
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclpy
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-pycommon
    - ros2-distro-mutex 0.16.* lyrical_*
