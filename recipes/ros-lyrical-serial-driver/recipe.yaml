# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-serial-driver
  version: 1.2.0
source:
  git: https://github.com/ros2-gbp/transport_drivers-release.git
  tag: release/lyrical/serial_driver/1.2.0-5
  target_directory: ros-lyrical-serial-driver/src/work
  patches:
    - patch/ros-lyrical-serial-driver.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros-drivers/transport_drivers
  license: Apache-2.0
  summary: A template class and associated utilities which encapsulate basic reading from serial ports
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - asio
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-auto
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-asio-cmake-module
    - ros-lyrical-io-context
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - asio
    - python
    - ros-lyrical-io-context
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
