# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-moveit-core
  version: 2.14.1
source:
  git: https://github.com/ros2-gbp/moveit2-release.git
  tag: release/lyrical/moveit_core/2.14.1-3
  target_directory: ros-lyrical-moveit-core/src/work
  patches:
    - patch/ros-lyrical-moveit-core.patch
    - patch/ros-lyrical-moveit-core.win.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org
  repository: https://github.com/moveit/moveit2
  license: BSD-3-Clause
  summary: Core libraries used by MoveIt
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - assimp
    - if: build_platform == target_platform
      then:
        - pkg-config
    - bullet
    - eigen
    - eigen-abi-devel
    - fcl
    - libboost-devel
    - libboost-python-devel
    - numpy
    - pip
    - pkg-config
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gmock
    - ros-lyrical-ament-cmake-google-benchmark
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-angles
    - ros-lyrical-common-interfaces
    - ros-lyrical-eigen-stl-containers
    - ros-lyrical-eigen3-cmake-module
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-geometric-shapes
    - ros-lyrical-geometry-msgs
    - ros-lyrical-google-benchmark-vendor
    - ros-lyrical-kdl-parser
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-moveit-common
    - ros-lyrical-moveit-msgs
    - ros-lyrical-moveit-resources-panda-moveit-config
    - ros-lyrical-moveit-resources-pr2-description
    - ros-lyrical-octomap-msgs
    - ros-lyrical-orocos-kdl-vendor
    - ros-lyrical-osqp-vendor
    - ros-lyrical-pluginlib
    - ros-lyrical-random-numbers
    - ros-lyrical-rcl-interfaces
    - ros-lyrical-rclcpp
    - ros-lyrical-rclpy
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rsl
    - ros-lyrical-ruckig
    - ros-lyrical-sensor-msgs
    - ros-lyrical-shape-msgs
    - ros-lyrical-srdfdom
    - ros-lyrical-std-msgs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-kdl
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-urdf
    - ros-lyrical-urdfdom
    - ros-lyrical-urdfdom-headers
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - assimp
    - bullet
    - eigen
    - fcl
    - libboost-devel
    - libboost-python-devel
    - python
    - ros-lyrical-angles
    - ros-lyrical-common-interfaces
    - ros-lyrical-eigen-stl-containers
    - ros-lyrical-eigen3-cmake-module
    - ros-lyrical-generate-parameter-library
    - ros-lyrical-geometric-shapes
    - ros-lyrical-geometry-msgs
    - ros-lyrical-google-benchmark-vendor
    - ros-lyrical-kdl-parser
    - ros-lyrical-moveit-common
    - ros-lyrical-moveit-msgs
    - ros-lyrical-octomap-msgs
    - ros-lyrical-osqp-vendor
    - ros-lyrical-pluginlib
    - ros-lyrical-random-numbers
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-workspace
    - ros-lyrical-rsl
    - ros-lyrical-ruckig
    - ros-lyrical-sensor-msgs
    - ros-lyrical-shape-msgs
    - ros-lyrical-srdfdom
    - ros-lyrical-std-msgs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-kdl
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-urdf
    - ros-lyrical-urdfdom
    - ros-lyrical-urdfdom-headers
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
