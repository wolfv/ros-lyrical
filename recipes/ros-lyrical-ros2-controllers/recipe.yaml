# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ros2-controllers
  version: 6.7.0
source:
  git: https://github.com/ros2-gbp/ros2_controllers-release.git
  tag: release/lyrical/ros2_controllers/6.7.0-1
  target_directory: ros-lyrical-ros2-controllers/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://control.ros.org
  repository: https://github.com/ros-controls/ros2_controllers/
  license: Apache-2.0
  summary: Metapackage for ros2_controllers related packages
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ackermann-steering-controller
    - ros-lyrical-admittance-controller
    - ros-lyrical-bicycle-steering-controller
    - ros-lyrical-chained-filter-controller
    - ros-lyrical-diff-drive-controller
    - ros-lyrical-force-torque-sensor-broadcaster
    - ros-lyrical-forward-command-controller
    - ros-lyrical-gpio-controllers
    - ros-lyrical-gps-sensor-broadcaster
    - ros-lyrical-imu-sensor-broadcaster
    - ros-lyrical-joint-state-broadcaster
    - ros-lyrical-joint-trajectory-controller
    - ros-lyrical-mecanum-drive-controller
    - ros-lyrical-motion-primitives-controllers
    - ros-lyrical-omni-wheel-drive-controller
    - ros-lyrical-parallel-gripper-controller
    - ros-lyrical-pid-controller
    - ros-lyrical-pose-broadcaster
    - ros-lyrical-range-sensor-broadcaster
    - ros-lyrical-ros-workspace
    - ros-lyrical-state-interfaces-broadcaster
    - ros-lyrical-steering-controllers-library
    - ros-lyrical-tricycle-controller
    - ros-lyrical-tricycle-steering-controller
    - ros2-distro-mutex 0.16.* lyrical_*
