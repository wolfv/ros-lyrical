# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-twist-mux
  version: 4.5.1
source:
  git: https://github.com/ros2-gbp/twist_mux-release.git
  tag: release/lyrical/twist_mux/4.5.1-3
  target_directory: ros-lyrical-twist-mux/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Twist multiplexer, which multiplex several velocity commands (topics) and allows to priorize or disable them (locks).
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-diagnostic-updater
    - ros-lyrical-geometry-msgs
    - ros-lyrical-launch
    - ros-lyrical-launch-testing
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-launch-testing-ros
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-diagnostic-updater
    - ros-lyrical-geometry-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros-lyrical-twist-mux-msgs
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
