# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rmw-zenoh-cpp
  version: 0.10.4
source:
  git: https://github.com/ros2-gbp/rmw_zenoh-release.git
  tag: release/lyrical/rmw_zenoh_cpp/0.10.4-1
  target_directory: ros-lyrical-rmw-zenoh-cpp/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0 OR BSD-3-Clause
  summary: A ROS 2 middleware implementation using zenoh-cpp
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libzenohc
    - libzenohcxx
    - nlohmann_json
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-fastcdr
    - ros-lyrical-rcpputils
    - ros-lyrical-rcutils
    - ros-lyrical-rmw
    - ros-lyrical-rmw-test-fixture
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-typesupport-fastrtps-c
    - ros-lyrical-rosidl-typesupport-fastrtps-cpp
    - ros-lyrical-tracetools
    - ros-lyrical-zenoh-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-fastcdr
    - ros-lyrical-rcpputils
    - ros-lyrical-rcutils
    - ros-lyrical-rmw
    - ros-lyrical-rmw-test-fixture
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-typesupport-fastrtps-c
    - ros-lyrical-rosidl-typesupport-fastrtps-cpp
    - ros-lyrical-tracetools
    - ros-lyrical-zenoh-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
