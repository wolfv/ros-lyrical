# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-robot-localization
  version: 3.10.0
source:
  git: https://github.com/ros2-gbp/robot_localization-release.git
  tag: release/lyrical/robot_localization/3.10.0-4
  target_directory: ros-lyrical-robot-localization/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/robot_localization
  license: Apache-2.0
  summary: Provides nonlinear state estimation through sensor fusion of an abritrary number of sensors.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros-lyrical-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - geographiclib-cpp
    - libboost-devel
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-angles
    - ros-lyrical-builtin-interfaces
    - ros-lyrical-diagnostic-msgs
    - ros-lyrical-diagnostic-updater
    - ros-lyrical-geographic-msgs
    - ros-lyrical-geometry-msgs
    - ros-lyrical-launch-ros
    - ros-lyrical-launch-testing-ament-cmake
    - ros-lyrical-message-filters
    - ros-lyrical-nav-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-generators
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-ros
    - ros-lyrical-yaml-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - eigen
    - geographiclib-cpp
    - libboost-devel
    - python
    - ros-lyrical-angles
    - ros-lyrical-builtin-interfaces
    - ros-lyrical-diagnostic-msgs
    - ros-lyrical-diagnostic-updater
    - ros-lyrical-geographic-msgs
    - ros-lyrical-geometry-msgs
    - ros-lyrical-message-filters
    - ros-lyrical-nav-msgs
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-runtime
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-geometry-msgs
    - ros-lyrical-tf2-ros
    - ros-lyrical-yaml-cpp-vendor
    - ros2-distro-mutex 0.16.* lyrical_*
