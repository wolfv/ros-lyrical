# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-autoware-point-types
  version: 1.7.0
source:
  git: https://github.com/ros2-gbp/autoware_core-release.git
  tag: release/humble/autoware_point_types/1.7.0-1
  target_directory: ros-lyrical-autoware-point-types/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: The point types definition to use point_cloud_msg_wrapper
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-copyright
    - ros-lyrical-ament-cmake-core
    - ros-lyrical-ament-cmake-cppcheck
    - ros-lyrical-ament-cmake-export-dependencies
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-cmake-test
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-autoware-cmake
    - ros-lyrical-autoware-lint-common
    - ros-lyrical-pcl-ros
    - ros-lyrical-point-cloud-msg-wrapper
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ament-cmake-copyright
    - ros-lyrical-ament-cmake-core
    - ros-lyrical-ament-cmake-cppcheck
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-test
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-pcl-ros
    - ros-lyrical-point-cloud-msg-wrapper
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
