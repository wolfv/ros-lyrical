# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-moveit-hybrid-planning
  version: 2.14.1
source:
  git: https://github.com/ros2-gbp/moveit2-release.git
  tag: release/lyrical/moveit_hybrid_planning/2.14.1-3
  target_directory: ros-lyrical-moveit-hybrid-planning/src/work
  patches:
    - patch/ros-lyrical-moveit-hybrid-planning.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://moveit.ros.org
  repository: https://github.com/moveit/moveit2
  license: BSD-3-Clause
  summary: Hybrid planning components of MoveIt 2
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-controller-manager
    - ros-lyrical-moveit-common
    - ros-lyrical-moveit-configs-utils
    - ros-lyrical-moveit-core
    - ros-lyrical-moveit-msgs
    - ros-lyrical-moveit-planners-ompl
    - ros-lyrical-moveit-resources-panda-moveit-config
    - ros-lyrical-moveit-ros-planning
    - ros-lyrical-moveit-ros-planning-interface
    - ros-lyrical-moveit-simple-controller-manager
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-action
    - ros-lyrical-rclcpp-components
    - ros-lyrical-robot-state-publisher
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-testing
    - ros-lyrical-ros-workspace
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-ros
    - ros-lyrical-trajectory-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-ament-index-cpp
    - ros-lyrical-controller-manager
    - ros-lyrical-moveit-common
    - ros-lyrical-moveit-core
    - ros-lyrical-moveit-msgs
    - ros-lyrical-moveit-resources-panda-moveit-config
    - ros-lyrical-moveit-ros-planning
    - ros-lyrical-moveit-ros-planning-interface
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-action
    - ros-lyrical-rclcpp-components
    - ros-lyrical-robot-state-publisher
    - ros-lyrical-ros-workspace
    - ros-lyrical-rviz2
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-ros
    - ros-lyrical-trajectory-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
