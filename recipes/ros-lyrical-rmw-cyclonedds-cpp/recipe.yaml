# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-rmw-cyclonedds-cpp
  version: 4.1.4
source:
  git: https://github.com/ros2-gbp/rmw_cyclonedds-release.git
  tag: release/lyrical/rmw_cyclonedds_cpp/4.1.4-3
  target_directory: ros-lyrical-rmw-cyclonedds-cpp/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Implement the ROS middleware interface using Eclipse CycloneDDS in C++.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: build_platform != target_platform
      then:
        - ros-lyrical-cyclonedds
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-ros-core
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-cyclonedds
    - ros-lyrical-iceoryx-binding-c
    - ros-lyrical-rcpputils
    - ros-lyrical-rcutils
    - ros-lyrical-rmw
    - ros-lyrical-rmw-dds-common
    - ros-lyrical-rmw-security-common
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-runtime-c
    - ros-lyrical-rosidl-typesupport-introspection-c
    - ros-lyrical-rosidl-typesupport-introspection-cpp
    - ros-lyrical-tracetools
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-cyclonedds
    - ros-lyrical-iceoryx-binding-c
    - ros-lyrical-rcpputils
    - ros-lyrical-rcutils
    - ros-lyrical-rmw
    - ros-lyrical-rmw-dds-common
    - ros-lyrical-rmw-security-common
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-runtime-c
    - ros-lyrical-rosidl-typesupport-introspection-c
    - ros-lyrical-rosidl-typesupport-introspection-cpp
    - ros-lyrical-tracetools
    - ros2-distro-mutex 0.16.* lyrical_*
