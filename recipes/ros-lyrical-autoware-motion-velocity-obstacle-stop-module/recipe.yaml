# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-autoware-motion-velocity-obstacle-stop-module
  version: 1.7.0
source:
  git: https://github.com/ros2-gbp/autoware_core-release.git
  tag: release/humble/autoware_motion_velocity_obstacle_stop_module/1.7.0-1
  target_directory: ros-lyrical-autoware-motion-velocity-obstacle-stop-module/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: obstacle stop feature in motion_velocity_planner
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - libboost-devel
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-auto
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-autoware-cmake
    - ros-lyrical-autoware-internal-planning-msgs
    - ros-lyrical-autoware-lint-common
    - ros-lyrical-autoware-motion-utils
    - ros-lyrical-autoware-motion-velocity-planner-common
    - ros-lyrical-autoware-perception-msgs
    - ros-lyrical-autoware-planning-msgs
    - ros-lyrical-autoware-signal-processing
    - ros-lyrical-autoware-test-utils
    - ros-lyrical-autoware-utils-debug
    - ros-lyrical-autoware-utils-geometry
    - ros-lyrical-autoware-utils-rclcpp
    - ros-lyrical-autoware-utils-system
    - ros-lyrical-autoware-utils-uuid
    - ros-lyrical-autoware-utils-visualization
    - ros-lyrical-autoware-vehicle-info-utils
    - ros-lyrical-geometry-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-tf2
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - libboost-devel
    - python
    - ros-lyrical-autoware-internal-planning-msgs
    - ros-lyrical-autoware-motion-utils
    - ros-lyrical-autoware-motion-velocity-planner-common
    - ros-lyrical-autoware-perception-msgs
    - ros-lyrical-autoware-planning-msgs
    - ros-lyrical-autoware-signal-processing
    - ros-lyrical-autoware-utils-debug
    - ros-lyrical-autoware-utils-geometry
    - ros-lyrical-autoware-utils-rclcpp
    - ros-lyrical-autoware-utils-system
    - ros-lyrical-autoware-utils-uuid
    - ros-lyrical-autoware-utils-visualization
    - ros-lyrical-autoware-vehicle-info-utils
    - ros-lyrical-geometry-msgs
    - ros-lyrical-pluginlib
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-workspace
    - ros-lyrical-tf2
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
