# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ros2cli-common-extensions
  version: 0.5.2
source:
  git: https://github.com/ros2-gbp/ros2cli_common_extensions-release.git
  tag: release/lyrical/ros2cli_common_extensions/0.5.2-3
  target_directory: ros-lyrical-ros2cli-common-extensions/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: Meta package for ros2cli common extensions
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-launch-xml
    - ros-lyrical-launch-yaml
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2action
    - ros-lyrical-ros2cli
    - ros-lyrical-ros2component
    - ros-lyrical-ros2doctor
    - ros-lyrical-ros2interface
    - ros-lyrical-ros2launch
    - ros-lyrical-ros2lifecycle
    - ros-lyrical-ros2multicast
    - ros-lyrical-ros2node
    - ros-lyrical-ros2param
    - ros-lyrical-ros2pkg
    - ros-lyrical-ros2plugin
    - ros-lyrical-ros2run
    - ros-lyrical-ros2service
    - ros-lyrical-ros2topic
    - ros-lyrical-sros2
    - ros2-distro-mutex 0.16.* lyrical_*
