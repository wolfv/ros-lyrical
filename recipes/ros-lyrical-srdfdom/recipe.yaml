# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-srdfdom
  version: 2.0.9
source:
  git: https://github.com/ros2-gbp/srdfdom-release.git
  tag: release/lyrical/srdfdom/2.0.9-3
  target_directory: ros-lyrical-srdfdom/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: http://ros.org/wiki/srdfdom
  repository: https://github.com/ros-planning/srdfdom
  license: BSD-3-Clause
  summary: Parser for Semantic Robot Description Format (SRDF).
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - console_bridge
    - libboost-devel
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-pytest
    - ros-lyrical-ament-cmake-python
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-cmake
    - ros-lyrical-console-bridge-vendor
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-urdf
    - ros-lyrical-urdfdom-headers
    - ros2-distro-mutex 0.16.* lyrical_*
    - tinyxml2
  run:
    - console_bridge
    - python
    - ros-lyrical-console-bridge-vendor
    - ros-lyrical-ros-workspace
    - ros-lyrical-urdf
    - ros-lyrical-urdfdom-py
    - ros2-distro-mutex 0.16.* lyrical_*
    - tinyxml2
