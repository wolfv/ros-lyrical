# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-moveit-visual-tools
  version: 4.1.2
source:
  git: https://github.com/ros2-gbp/moveit_visual_tools-release.git
  tag: release/lyrical/moveit_visual_tools/4.1.2-3
  target_directory: ros-lyrical-moveit-visual-tools/src/work
  patches:
    - patch/ros-lyrical-moveit-visual-tools.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/ros-planning/moveit_visual_tools
  repository: https://github.com/ros-planning/moveit_visual_tools/
  license: BSD-3-Clause
  summary: Helper functions for displaying and debugging MoveIt data in Rviz via published markers
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - ${{ 'libgl-devel' if linux }}
    - ${{ 'libopengl-devel' if linux }}
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-geometry-msgs
    - ros-lyrical-graph-msgs
    - ros-lyrical-moveit-common
    - ros-lyrical-moveit-core
    - ros-lyrical-moveit-ros-planning
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rviz-visual-tools
    - ros-lyrical-std-msgs
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-ros
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - python
    - ros-lyrical-geometry-msgs
    - ros-lyrical-graph-msgs
    - ros-lyrical-moveit-common
    - ros-lyrical-moveit-core
    - ros-lyrical-moveit-ros-planning
    - ros-lyrical-rclcpp
    - ros-lyrical-ros-workspace
    - ros-lyrical-rviz-visual-tools
    - ros-lyrical-std-msgs
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-ros
    - ros-lyrical-trajectory-msgs
    - ros-lyrical-visualization-msgs
    - ros2-distro-mutex 0.16.* lyrical_*
