# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ros2launch
  version: 0.29.8
source:
  git: https://github.com/ros2-gbp/launch_ros-release.git
  tag: release/lyrical/ros2launch/0.29.8-1
  target_directory: ros-lyrical-ros2launch/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_python.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_python.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: Apache-2.0
  summary: The launch command for ROS 2 command line tools.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - numpy
    - pip
    - pytest
    - python
    - ros-lyrical-ament-copyright
    - ros-lyrical-ament-flake8
    - ros-lyrical-ament-pep257
    - ros-lyrical-ament-xmllint
    - ros-lyrical-launch-xml
    - ros-lyrical-launch-yaml
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
    - setuptools
  run:
    - python
    - ros-lyrical-ament-index-python
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-launch-xml
    - ros-lyrical-launch-yaml
    - ros-lyrical-ros-workspace
    - ros-lyrical-ros2cli
    - ros-lyrical-ros2pkg
    - ros2-distro-mutex 0.16.* lyrical_*
