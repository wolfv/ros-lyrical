# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-gz-tools-vendor
  version: 0.2.1
source:
  git: https://github.com/ros2-gbp/gz_tools_vendor-release.git
  tag: release/lyrical/gz_tools_vendor/0.2.1-3
  target_directory: ros-lyrical-gz-tools-vendor/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://github.com/gazebosim/gz-tools
  license: Apache-2.0
  summary: "Vendor package for: gz-tools2 2.0.3 Gazebo Tools: Entrypoint to Gazebo's command line interface"
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - gz-tools
    - numpy
    - pip
    - python
    - ros-lyrical-ament-cmake-copyright
    - ros-lyrical-ament-cmake-core
    - ros-lyrical-ament-cmake-lint-cmake
    - ros-lyrical-ament-cmake-test
    - ros-lyrical-ament-cmake-vendor-package
    - ros-lyrical-ament-cmake-xmllint
    - ros-lyrical-gz-cmake-vendor
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - gz-tools
    - python
    - ros-lyrical-gz-cmake-vendor
    - ros-lyrical-ros-workspace
    - ros2-distro-mutex 0.16.* lyrical_*
    - ruby
