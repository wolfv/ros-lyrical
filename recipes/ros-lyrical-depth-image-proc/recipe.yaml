# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-depth-image-proc
  version: 7.1.6
source:
  git: https://github.com/ros2-gbp/image_pipeline-release.git
  tag: release/lyrical/depth_image_proc/7.1.6-1
  target_directory: ros-lyrical-depth-image-proc/src/work
  patches:
    - patch/ros-lyrical-depth-image-proc.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  homepage: https://index.ros.org/p/depth_image_proc/
  repository: https://github.com/ros-perception/image_pipeline
  license: BSD-3-Clause
  summary: Contains components for processing depth images such as those produced by OpenNI camera. Functions include creating disparity images and point clouds, as well as registering (reprojecting) a depth image into another camera frame.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen-abi-devel
    - libgl-devel
    - libopencv
    - libopengl-devel
    - numpy
    - pip
    - py-opencv
    - python
    - ros-lyrical-ament-cmake-auto
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-class-loader
    - ros-lyrical-cv-bridge
    - ros-lyrical-image-geometry
    - ros-lyrical-image-proc
    - ros-lyrical-image-transport
    - ros-lyrical-message-filters
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros-lyrical-stereo-msgs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-ros
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - libgl-devel
    - libopencv
    - libopengl-devel
    - py-opencv
    - python
    - ros-lyrical-cv-bridge
    - ros-lyrical-image-geometry
    - ros-lyrical-image-proc
    - ros-lyrical-image-transport
    - ros-lyrical-message-filters
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-ros-workspace
    - ros-lyrical-sensor-msgs
    - ros-lyrical-stereo-msgs
    - ros-lyrical-tf2
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-ros
    - ros2-distro-mutex 0.16.* lyrical_*
