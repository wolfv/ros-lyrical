# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-kdl-parser
  version: 3.0.1
source:
  git: https://github.com/ros2-gbp/kdl_parser-release.git
  tag: release/lyrical/kdl_parser/3.0.1-3
  target_directory: ros-lyrical-kdl-parser/src/work

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  repository: https://github.com/ros2/kdl_parser
  license: BSD-3-Clause
  summary: The Kinematics and Dynamics Library (KDL) defines a tree structure to represent the kinematic and dynamic parameters of a robot mechanism.<tt>kdl_parser</tt>provides tools to construct a KDL tree from an XML robot representation in URDF.
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - numpy
    - orocos-kdl
    - pip
    - python
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-ament-cmake-ros
    - ros-lyrical-ament-lint-auto
    - ros-lyrical-ament-lint-common
    - ros-lyrical-eigen3-cmake-module
    - ros-lyrical-rcutils
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-urdf
    - ros-lyrical-urdfdom-headers
    - ros2-distro-mutex 0.16.* lyrical_*
  run:
    - orocos-kdl
    - python
    - ros-lyrical-rcutils
    - ros-lyrical-ros-workspace
    - ros-lyrical-urdf
    - ros-lyrical-urdfdom-headers
    - ros2-distro-mutex 0.16.* lyrical_*
