# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json

package:
  name: ros-lyrical-ouster-ros
  version: 0.14.2
source:
  git: https://github.com/ros2-gbp/ouster-ros-release.git
  tag: release/lyrical/ouster_ros/0.14.2-3
  target_directory: ros-lyrical-ouster-ros/src/work
  patches:
    - patch/ros-lyrical-ouster-ros.patch

build:
  script: ${{ '$RECIPE_DIR/build_ament_cmake.sh' if unix or wasm32 else '%RECIPE_DIR%\\bld_ament_cmake.bat' }}
  number: 20
  post_process:
    - files:
        - '*.pc'
      regex: (?:-L|-I)?"?([^;\s]+/sysroot/)
      replacement: $$(CONDA_BUILD_SYSROOT_S)
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/sysroot)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
    - files:
        - '*.cmake'
      regex: ([^;\s"]+/MacOSX\d*\.?\d*\.sdk)
      replacement: $$ENV{CONDA_BUILD_SYSROOT}
about:
  license: BSD-3-Clause
  summary: Ouster ROS2 driver
extra:
  recipe-maintainers:
    - ros-forge

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ compiler('c') }}
    - if: target_platform!='emscripten-wasm32'
      then:
        - ${{ stdlib('c') }}
    - ninja
    - python
    - setuptools
    - git
    - git-lfs
    - if: unix
      then:
        - patch
        - make
        - coreutils
    - if: win
      then:
        - m2-patch
    - if: osx
      then:
        - tapi
    - if: build_platform != target_platform
      then:
        - pkg-config
    - cmake
    - cython
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - numpy
    - if: target_platform == 'emscripten-wasm32'
      then:
        - ros-lyrical-rosidl-default-generators
  host:
    - if: build_platform == target_platform
      then:
        - pkg-config
    - eigen
    - eigen-abi-devel
    - fmt
    - gtest
    - jsoncpp
    - libboost-devel
    - libcurl
    - libgl-devel
    - libopengl-devel
    - libtins
    - libzip
    - numpy
    - pcl
    - pip
    - python
    - ros-lyrical-ament-cmake
    - ros-lyrical-ament-cmake-gtest
    - ros-lyrical-class-loader
    - ros-lyrical-cv-bridge
    - ros-lyrical-geometry-msgs
    - ros-lyrical-ouster-sensor-msgs
    - ros-lyrical-pcl-conversions
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-environment
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-generators
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-eigen
    - ros-lyrical-tf2-ros
    - ros2-distro-mutex 0.16.* lyrical_*
    - spdlog
    - vtk-base
  run:
    - fmt
    - jsoncpp
    - libcurl
    - python
    - ros-lyrical-class-loader
    - ros-lyrical-cv-bridge
    - ros-lyrical-geometry-msgs
    - ros-lyrical-launch
    - ros-lyrical-launch-ros
    - ros-lyrical-ouster-sensor-msgs
    - ros-lyrical-pcl-conversions
    - ros-lyrical-rclcpp
    - ros-lyrical-rclcpp-components
    - ros-lyrical-rclcpp-lifecycle
    - ros-lyrical-ros-workspace
    - ros-lyrical-rosidl-default-runtime
    - ros-lyrical-sensor-msgs
    - ros-lyrical-std-msgs
    - ros-lyrical-std-srvs
    - ros-lyrical-tf2-ros
    - ros2-distro-mutex 0.16.* lyrical_*
    - spdlog
